<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأولمبياد الوطني نسمو - أكاديمية معافر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#1d2433;--muted:#667085;--primary:#1a56db;--border:#d0d5dd;--ok:#067647;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--text:#eef1f7;--muted:#98a2b3;--primary:#5b8cff;--border:#3a4358;--ok:#4ade80;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',Tahoma,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.card{background:var(--card);width:100%;max-width:480px;border-radius:16px;padding:28px 24px;box-shadow:0 4px 24px rgba(0,0,0,.08);align-self:flex-start}
.head{text-align:center;margin-bottom:24px}
.logo{width:100%;max-width:260px;display:block;margin:0 auto 10px;border-radius:12px;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){.logo{mix-blend-mode:normal}}
.radios{display:flex;gap:12px}
.radios label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.radios input{width:auto;margin:0}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0}
label{display:block;font-weight:500;margin:16px 0 6px;font-size:15px}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--card);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--primary);border-color:transparent}
select:disabled{opacity:.55}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:16px;text-align:center;font-weight:500;min-height:22px}
</style>
</head>

    <input id="phone" name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" pattern="[0-9٠-٩+ ]{9,15}" required style="text-align:right">

    <label for="grade">الصف الدراسي</label>
    <select id="grade" name="grade" required>
      <option value="">اختر الصف</option>
      <option>أول متوسط</option>
      <option>ثاني متوسط</option>
      <option>ثالث متوسط</option>
      <option>أول ثانوي</option>
    </select>

    <label for="branch">الفرع المشارك به</label>
    <select id="branch" name="branch" required disabled>
      <option value="">اختر الصف أولاً</option>
    </select>

    <label for="score">درجة الطالب</label>
    <input id="score" name="score" type="number" min="0" step="any" inputmode="decimal" required>

    <label>هل تم الترشيح للمرحلة الثانية؟</label>
    <div class="radios">
      <label><input type="radio" name="nominated" value="نعم" required> نعم</label>
      <label><input type="radio" name="nominated" value="لا"> لا</label>
    </div>

    <button id="btn" type="submit">إرسال</button>
    <div id="msg" role="status"></div>
  </form>
</div>

<script>
// ضع هنا رابط تطبيق الويب من Google Apps Script بعد نشره
const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";

const branches = {
  junior: ["رياضيات ناشئين", "علوم", "معلوماتية ناشئين"],
  senior: ["رياضيات كبار", "معلوماتية كبار", "أحياء", "كيمياء"]
};
const grade = document.getElementById("grade");
const branch = document.getElementById("branch");

grade.addEventListener("change", () => {
  const g = grade.value;
  const list = g === "أول متوسط" || g === "ثاني متوسط" ? branches.junior
             : g ? branches.senior : null;
  branch.innerHTML = "";
  if (!list) {
    branch.innerHTML = '<option value="">اختر الصف أولاً</option>';
    branch.disabled = true;
    return;
  }
  branch.add(new Option("اختر الفرع", ""));
  list.forEach(b => branch.add(new Option(b, b)));
  branch.disabled = false;
});

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("btn");
  msg.style.color = "";
  if (SCRIPT_URL.startsWith("PASTE")) { msg.style.color = "var(--err)"; msg.textContent = "لم يتم ربط الصفحة بـ Google Sheet بعد."; return; }
  btn.disabled = true; msg.textContent = "جارٍ الإرسال...";
  const data = new URLSearchParams({
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    grade: grade.value,
    branch: branch.value,
    score: document.getElementById("score").value,
    nominated: document.querySelector('input[name="nominated"]:checked').value
  });
  try {
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: data });
    msg.style.color = "var(--ok)"; msg.textContent = "تم إرسال بياناتك بنجاح ✓";
    e.target.reset(); grade.dispatchEvent(new Event("change"));
  } catch (err) {
    msg.style.color = "var(--err)"; msg.textContent = "تعذّر الإرسال، حاول مرة أخرى.";
  }
  btn.disabled = false;
});
</script>
</body>
</html>
